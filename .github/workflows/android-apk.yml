name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies (ejs, three)
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Build the offline web bundle
        run: node scripts/build-offline.js

      - name: Install Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        working-directory: mobile
        run: npx cap add android

      - name: Copy the web bundle into Android
        working-directory: mobile
        run: npx cap sync android

      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect the APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk TimeWarp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TimeWarp-apk
          path: TimeWarp.apk

      - name: Publish a release with the APK (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: TimeWarp APK ${{ github.run_number }}
          files: TimeWarp.apk
